<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CivicLens</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">CivicLens</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="my-reports.html">My Reports</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-page">

        <div class="auth-container">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Login to CivicLens</h1>

            <p class="auth-description">
                Sign in to report community issues and track your reports.
            </p>

            <form class="auth-form">

                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="#">Create an account</a>
            </p>

        </div>

    </main>

</body>
</html>
