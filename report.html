<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue | CivicLens</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">CivicLens</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="#">My Reports</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main class="report-page">
       <div class="report-container">

    <p class="eyebrow">COMMUNITY REPORT</p>

    <h1>Report a waste issue</h1>

    <p>
        Help us identify waste problems in your community.
    </p>

    <form class="report-form">

        <label for="issue-type">Issue type</label>
        <select id="issue-type">
            <option value="">Select an issue</option>
            <option value="illegal-dumping">Illegal dumping</option>
            <option value="overflowing-bin">Overflowing bin</option>
            <option value="plastic-waste">Plastic waste</option>
            <option value="construction-waste">Construction waste</option>
            <option value="other">Other</option>
        </select>

        <label for="location">Location</label>
        <input
            type="text"
            id="location"
            placeholder="Enter the location"
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            rows="5"
            placeholder="Describe the waste problem..."
        ></textarea>

        <label for="photo">Upload photo</label>
        <input type="file" id="photo" accept="image/*">

        <button type="submit" class="primary-btn">
            Submit Report
        </button>

    </form>

</div>
    </main>

</body>
</html>
